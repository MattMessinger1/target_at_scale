<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- WCEPS Logo Mark - Stylized W with interlocking chevrons -->
  
  <!-- Top chevron (pointing up) -->
  <polygon points="16,1 10.5,6.5 16,12 21.5,6.5" fill="#C8325B"/>
  
  <!-- Center chevron (pointing down) - overlaps with wings -->
  <polygon points="16,10 10.5,15.5 16,21 21.5,15.5" fill="#C8325B"/>
  
  <!-- Left wing (open chevron pointing up-left) - overlaps center -->
  <polygon points="1,18 6.5,12.5 12,18 12,24 6.5,18.5 1,24" fill="#C8325B"/>
  
  <!-- Right wing (open chevron pointing up-right) - overlaps center -->
  <polygon points="31,18 25.5,12.5 20,18 20,24 25.5,18.5 31,24" fill="#C8325B"/>
</svg>
