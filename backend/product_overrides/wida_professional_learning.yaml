elevator_pitch: "WIDA Professional Learning provides comprehensive, research-based training for educators working with multilingual learners, offering flexible online and in-person options aligned to WIDA standards and frameworks."

offerings:
  - "Online self-paced courses for WIDA framework foundations"
  - "Live virtual and in-person workshops facilitated by WIDA experts"
  - "Customized district-level professional learning programs"
  - "WIDA ELD Standards Framework training"
  - "Can Do Descriptors implementation support"
  - "Academic language development strategies"
  - "Assessment literacy for ELP assessment data"
  - "Train-the-trainer programs for sustainability"

