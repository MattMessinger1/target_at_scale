safe_claims:
  - "The AIW Framework is developed by researchers at the University of Wisconsin-Madison."
  - "AIW provides research-based criteria for authentic intellectual work."
  - "The AIW rubrics are formative tools designed to support teacher growth, not evaluate teachers."

differentiators:
  - "Developed by UW-Madison researchers - grounded in decades of education research"
  - "Framework, not a checklist - focuses on deep learning principles, not compliance"
  - "Rubrics are formative, not evaluative - supports growth rather than judgment"
  - "Three core criteria: construction of knowledge, disciplined inquiry, value beyond school"
  - "Applicable across all content areas and grade levels"
  - "Team-based approach builds collaborative professional culture"
  - "Focuses on student work and instructional tasks, not just teaching behaviors"

compliance_hooks:
  - "Professional development requirements"
  - "School improvement plan instructional quality components"
  - "Teacher evaluation growth goals"
  - "Curriculum alignment and coherence initiatives"
  - "Deeper learning and 21st century skills mandates"
  - "Standards-based instruction improvement"
  - "Accreditation instructional quality evidence"

