implementation:
  what_wceps_does:
    - "Facilitates AIW professional development workshops"
    - "Trains school-based AIW teams in rubric scoring"
    - "Provides ongoing coaching and calibration support"
    - "Delivers train-the-trainer certification programs"
  what_district_does:
    - "Identifies teachers and leaders for AIW teams"
    - "Schedules regular team meeting time"
    - "Commits to collecting and scoring instructional artifacts"
