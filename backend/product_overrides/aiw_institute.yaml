# AIW Institute - Authentic Intellectual Work
# Professional development using the Framework for Authentic Intellectual Work

elevator_pitch: "The AIW Institute provides professional development and capacity building using the Framework for Authentic Intellectual Work (AIW). This research-based framework focuses on high-quality learning through construction of knowledge, disciplined inquiry, and value beyond school."

offerings:
  - "AIW Framework professional development workshops"
  - "AIW rubrics training for scoring instructional artifacts"
  - "School-based AIW team coaching and support"
  - "Train-the-trainer programs for district sustainability"
  - "AIW scoring calibration sessions"
  - "Instructional design using AIW criteria"
  - "Leadership development for AIW implementation"

