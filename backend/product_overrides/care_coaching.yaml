elevator_pitch: "CARE Coaching is job-embedded professional learning that helps districts build instructional capacity for multilingual learners through coaching cycles, practical tools, and sustained implementation support."

offerings:
  - "Job-embedded coaching cycles aligned to district priorities"
  - "Facilitated PLC structures and coaching routines"
  - "Implementation planning support for district/school improvement plans"
  - "Artifacts and documentation support to evidence PD completion"
  - "CARE Coaching Needs Assessment (CCNA)"
  - "Empowering Newcomers for Academic Success"

who_its_for:
  - "District leadership"
  - "ELL/Multilingual directors"
  - "Instructional coaches"
  - "Principals and teacher leaders"

problems_solved:
  - "Meeting mandated ESOL/EL PD requirements with high-quality, relevant learning"
  - "Turning school improvement plans into consistent classroom practice"
  - "Building teacher capacity without adding unsustainable workload"
  - "Creating a clear implementation routine districts can sustain"

implementation:
  what_wceps_does:
    - "Co-designs coaching focus areas aligned to district priorities and compliance drivers"
    - "Provides coaching structures, tools, and facilitation to support consistent implementation"
  what_district_does:
    - "Identifies priority campuses/teams and schedules coaching/PLC touchpoints"
    - "Aligns coaching focus with existing improvement plans and reporting needs"
  timeline: "Flexible; typically structured in cycles across a semester or school year."

safe_claims:
  - "CARE Coaching supports job-embedded professional learning and implementation routines."
  - "CARE Coaching can be aligned to compliance-driven priorities (when districts choose the focus)."

differentiators:
  - "Job-embedded coaching counts toward state-mandated PD hours - teachers learn while implementing, not in separate workshops"
  - "Coaching cycles align to district's existing improvement plans - not a generic program that adds extra work"
  - "Sustained implementation support over months, not one-time training events that fade"
  - "Artifacts and documentation built into the process - ready evidence for compliance reporting"
  - "WIDA-aligned expertise specifically for multilingual learner instruction - not generic coaching"

compliance_hooks:
  - "State-mandated ESOL/EL professional development hours"
  - "CSI/TSI school improvement plan implementation"
  - "Teacher endorsement and certification requirements"
  - "Corrective action plan evidence of PD completion"
  - "Title III professional development requirements"
  - "State monitoring documentation for EL programs"

case_studies:
  - state: null
    district: null
    context: "Districts implementing CARE Coaching cycles can document job-embedded PD hours that count toward state ESOL endorsement requirements while building sustainable instructional practices."
    proof_snippet: "Coaching cycles provide artifacts and documentation that evidence PD completion for compliance reporting."
    outcomes: null

avoid_phrases:
  - "Are you maximizing"
  - "Did you know"
  - "If you aren't"
  - "You should have"

states:
  FL:
    state_fit_notes:
      - "Florida districts can align coaching cycles to ESOL endorsement/in-service requirements and school improvement planning processes."

# Optional: tune which KB documents/chunks get prioritized for evidence retrieval.
# Use `file_name` values shown in the UI evidence panel (preferred over UUIDs).
kb_curation:
  max_total_chunks: 18
  max_chunks_per_source: 2
  boosts: []
  must_include: []
  exclude: []
