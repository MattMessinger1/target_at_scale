# WebbAlign - Webb Alignment Studies & DOK Professional Development
# Developed in collaboration with Dr. Norman L. Webb

elevator_pitch: "WebbAlign is WCEPS's program developed in collaboration with Dr. Norman Webb, creator of the Depth of Knowledge (DOK) framework. We provide formal Webb Alignment Studies - the gold-standard research methodology for evaluating standards-curriculum-assessment alignment - plus comprehensive DOK professional development that builds educator capacity for rigorous alignment work."

offerings:
  # Webb Alignment Study Services
  - "Formal Webb Alignment Study - systematic research process evaluating alignment between standards, curriculum, and assessments"
  - "DOK analysis applying all four levels (Recall, Skills/Concepts, Strategic Thinking, Extended Thinking)"
  - "Alignment matrices showing Content Focus, DOK Consistency, Range of Knowledge, and Balance of Representation"
  - "Gap analysis identifying misalignment between standards and instruction/assessment"
  - "Trained expert reviewer panels with inter-rater reliability protocols"
  - "Formal alignment reports with findings defensible under audits, accreditation, and legal review"
  
  # Professional Development Services  
  - "DOK Foundations PD - what DOK is (and is not), accurate interpretation, differentiating complexity from difficulty"
  - "Alignment Workshops - district-level, teacher team, and leadership team sessions"
  - "Hands-on Application PD - coding real classroom tasks, assessment items, and curricular units by DOK level"
  - "Customized support for state education agencies, assessment publishers, and industry partners"
  - "Multiple delivery formats: in-person workshops, virtual sessions, hybrid, ongoing coaching, multi-day institutes"

who_its_for:
  - "Curriculum and assessment directors"
  - "State education agency staff"
  - "Assessment publishers and developers"
  - "Instructional coaches and curriculum specialists"
  - "District leadership teams"
  - "Classroom teachers seeking deeper alignment understanding"
  - "Content publishers and industry partners"

problems_solved:
  - "Validating that curriculum actually teaches what standards require (not just content coverage, but cognitive demand)"
  - "Ensuring assessments measure the DOK level specified in standards (avoiding DOK 3 standards tested at DOK 1)"
  - "Meeting state accountability and program approval requirements with research-based evidence"
  - "Federal compliance documentation for ESSA, Title I, Title III alignment requirements"
  - "Accreditation alignment documentation that holds up under review"
  - "Building assessment literacy - educators understand how standards relate to what students actually do"
  - "Creating coherent systems where instruction and assessment align tightly with learning expectations"
  - "ESOL endorsement course-to-standards alignment verification"

implementation:
  what_wceps_does:
    - "Conducts formal Webb Alignment Studies with trained expert reviewers"
    - "Codes standards and materials for content focus and DOK level"
    - "Applies all four Webb alignment criteria systematically"
    - "Delivers PD in customized formats (in-person, virtual, hybrid, coaching, institutes)"
    - "Provides alignment matrices, gap analysis, and narrative findings with recommendations"
  what_district_does:
    - "Provides standards, curriculum materials, and/or assessments for analysis"
    - "Identifies priority content areas, grade levels, or programs"
    - "Commits staff time for PD participation and implementation"
    - "Engages in collaborative DOK coding exercises during PD"
  timeline: "Alignment studies typically 4-8 weeks; PD can be single sessions to multi-day institutes; ongoing coaching available."

safe_claims:
  - "WebbAlign is developed in collaboration with Dr. Norman Webb, creator of the DOK framework"
  - "Webb Alignment Studies are the nationally recognized gold standard for alignment research"
  - "Our methodology is research-based, defensible, and holds up under audits, accreditation, and legal review"
  - "Applies all four official Webb alignment criteria: Content Focus, DOK Consistency, Range of Knowledge, Balance of Representation"

differentiators:
  - "Direct collaboration with Dr. Norman Webb - the originator of DOK methodology"
  - "Formal Webb Alignment Study methodology - not a checklist or keyword matching, but systematic cognitive demand analysis"
  - "Trained expert reviewer panels with inter-rater reliability protocols"
  - "Results are research-based and defensible under audits, accreditation, and legal review"
  - "Item-level DOK coding across all four levels, not just surface content matching"
  - "PD translates DOK language into teacher-friendly, actionable practices"
  - "Customizable delivery: workshops, virtual, hybrid, coaching, multi-day institutes"

