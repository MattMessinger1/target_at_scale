elevator_pitch: "WIDA SIS (Student Information System) is a comprehensive EL program management platform that helps districts track student data, manage compliance requirements, and generate reports for state and federal accountability."

offerings:
  - "Centralized EL student data management"
  - "Automated compliance tracking and alerts"
  - "State and federal reporting tools (Title III, ESSA)"
  - "Home Language Survey and identification workflow management"
  - "Reclassification and exit criteria tracking"
  - "Parent notification and communication logging"
  - "Assessment data integration (ACCESS, WIDA MODEL)"

who_its_for:
  - "EL/ESL/ESOL directors and coordinators"
  - "District data and accountability staff"
  - "Title III coordinators"
  - "Building-level EL program managers"
  - "Compliance officers"

problems_solved:
  - "Difficulty tracking EL student data across multiple systems"
  - "Risk of missing compliance deadlines and reporting requirements"
  - "Manual, error-prone processes for state and federal reporting"
  - "Lack of visibility into EL program performance across the district"
  - "Challenges documenting parent notifications and communications"
  - "Managing reclassification workflows and exit criteria"

implementation:
  what_wceps_does:
    - "Provides SIS platform setup and configuration"
    - "Offers data migration support from existing systems"
    - "Delivers training for administrators and users"
    - "Provides ongoing technical support and updates"
  what_district_does:
    - "Assigns system administrators and users"
    - "Provides historical EL data for migration"
    - "Establishes data entry and maintenance workflows"
  timeline: "Initial setup and migration typically 2-3 months; ongoing support available."

safe_claims:
  - "WIDA SIS streamlines EL compliance tracking and reporting."
  - "WIDA SIS integrates with WIDA assessment data for comprehensive EL program management."
  - "WIDA SIS helps districts meet state and federal EL reporting requirements."

differentiators:
  - "Native integration with WIDA ACCESS and MODEL assessment data - no manual data imports or crosswalking"
  - "Built specifically for EL program management - not a generic SIS with EL features bolted on"
  - "Automated compliance alerts and deadline tracking prevent missed reporting requirements"
  - "ESSA and Title III reporting templates pre-built for federal accountability"
  - "Parent notification workflows with documentation audit trails for OCR compliance"
  - "Reclassification tracking aligned to WIDA proficiency levels and state exit criteria"

compliance_hooks:
  - "Title III reporting requirements"
  - "ESSA EL data collection mandates"
  - "state EL identification and reclassification compliance"
  - "parent notification documentation"
  - "Home Language Survey tracking"
  - "monitoring review preparation"
  - "OCR data requests"
  - "audit documentation"
  - "corrective action plan tracking"

avoid_phrases:
  - "Are you maximizing"
  - "Did you know"
  - "If you aren't"
  - "You should have"
