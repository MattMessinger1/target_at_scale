elevator_pitch: "WIDA MODEL is the only interim English language proficiency assessment that predicts ACCESS scores, enabling districts to monitor EL progress throughout the year and make data-driven instructional decisions."

offerings:
  - "Interim ELP assessment aligned to WIDA standards"
  - "Predictive scoring that correlates to ACCESS performance"
  - "Online and paper-based administration options"
  - "Detailed domain-level reporting (listening, speaking, reading, writing)"
  - "Progress monitoring tools for EL students"
  - "Professional development on using MODEL data"

who_its_for:
  - "EL/ESL/ESOL directors and coordinators"
  - "District assessment coordinators"
  - "Building principals with EL populations"
  - "EL teachers and interventionists"
  - "Title III coordinators"

problems_solved:
  - "Lack of interim data to predict ACCESS outcomes before high-stakes testing"
  - "Difficulty identifying EL students at risk of not meeting reclassification criteria"
  - "Need for formative ELP data to adjust instruction mid-year"
  - "Meeting state requirements for EL progress monitoring"
  - "Providing evidence of EL program effectiveness for compliance reporting"
  - "Supporting reclassification decisions with multiple data points"

implementation:
  what_wceps_does:
    - "Provides assessment platform access and technical setup"
    - "Offers training on administration and score interpretation"
    - "Delivers ongoing support for data analysis and reporting"
  what_district_does:
    - "Schedules assessment windows within the school calendar"
    - "Ensures technology readiness for online administration"
    - "Trains teachers on using results for instructional planning"
  timeline: "Can be administered in fall, winter, or spring windows; flexible scheduling."

safe_claims:
  - "WIDA MODEL is the only interim assessment designed to predict ACCESS scores."
  - "WIDA MODEL provides domain-level data for targeted EL instruction."
  - "WIDA MODEL supports compliance with state EL progress monitoring requirements."

compliance_hooks:
  - "EL progress monitoring mandates"
  - "Title III accountability requirements"
  - "ACCESS preparation and prediction"
  - "reclassification decision support"
  - "state ELP assessment compliance"
  - "CSI/TSI school improvement for EL subgroup"
  - "corrective action plan evidence"
  - "monitoring review documentation"

avoid_phrases:
  - "Are you maximizing"
  - "Did you know"
  - "If you aren't"
  - "You should have"
