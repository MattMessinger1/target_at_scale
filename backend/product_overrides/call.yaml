elevator_pitch: "CALL (Comprehensive Assessment of Leadership for Learning) is a cloud-based, school-wide leadership assessment and feedback system that helps districts evaluate distributed leadership practices, support professional growth, and drive school improvement planning."

offerings:
  - "Multi-source survey assessing distributed leadership practices across the school"
  - "Automated, targeted data and feedback reports"
  - "Five-domain leadership framework (Focus on Learning, Monitoring Teaching/Learning, Building Nested Learning Communities, Acquiring/Allocating Resources, Maintaining Safe/Effective Learning Environment)"
  - "Professional development planning support based on assessment results"
  - "School improvement planning tools"

offering_map:
  - offering: "Multi-source survey assessing distributed leadership practices across the school"
    keywords:
      - "survey"
      - "distributed leadership"
      - "leadership assessment"
  - offering: "Automated, targeted data and feedback reports"
    keywords:
      - "feedback report"
      - "report"
      - "data"
  - offering: "Professional development planning support based on assessment results"
    keywords:
      - "professional development"
      - "pd"
      - "planning"
  - offering: "School improvement planning tools"
    keywords:
      - "school improvement"
      - "improvement plan"

who_its_for:
  - "District leadership"
  - "Principals and assistant principals"
  - "School improvement teams"
  - "Instructional coaches"
  - "Teacher leaders involved in distributed leadership"

problems_solved:
  - "Understanding distributed leadership effectiveness across the school"
  - "Identifying specific leadership practice areas needing development"
  - "Grounding school improvement plans in evidence-based leadership data"
  - "Supporting principal and leadership team professional growth with actionable feedback"
  - "Moving beyond individual leader evaluation to school-wide leadership assessment"

implementation:
  what_wceps_does:
    - "Provides access to the cloud-based CALL survey platform"
    - "Delivers automated feedback reports and data analysis"
    - "Supports interpretation of results and action planning"
  what_district_does:
    - "Administers multi-source surveys to school staff"
    - "Reviews leadership assessment results"
    - "Develops professional growth and school improvement plans based on findings"
  timeline: "Survey administration typically takes 2-3 weeks; results available immediately after completion."

safe_claims:
  - "CALL is a research-based leadership assessment developed and validated by University of Wisconsin-Madison researchers."
  - "CALL assesses distributed leadership practices across five research-validated domains."
  - "CALL provides automated, actionable feedback to support leadership development and school improvement."

differentiators:
  - "Research-validated by UW-Madison - not a generic survey but a peer-reviewed leadership assessment"
  - "Focuses on distributed leadership across the school - not just principal evaluation"
  - "Multi-source feedback from teachers, staff, and leadership - comprehensive 360-degree view"
  - "Five research-based domains provide specific, actionable areas for leadership development"
  - "Automated reporting delivers instant insights - no waiting for manual analysis"
  - "Directly connects to school improvement planning requirements - evidence-based leadership data"

case_studies:
  - state: null
    district: null
    context: "Schools use CALL to assess distributed leadership practices and ground improvement plans in evidence-based data."
    proof_snippet: "CALL provides multi-source feedback across five research-validated leadership domains."
    outcomes: null

compliance_hooks:
  - "Title II-A principal professional development funding"
  - "School improvement planning requirements"
  - "CSI/TSI evidence-based leadership assessment"
  - "Principal evaluation and growth planning"
  - "Distributed leadership documentation"

avoid_phrases:
  - "Are you maximizing"
  - "Did you know"
  - "If you aren't"
  - "You should have"
