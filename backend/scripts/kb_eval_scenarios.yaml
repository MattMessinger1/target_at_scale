scenarios:
  # Add/edit scenarios over time. The key metrics to watch:
  # - Are we retrieving diverse, high-signal sources (not many chunks from one doc)?
  # - Do your expected "authoritative" docs show up in top evidence?
  #
  # Tip: Use the Evidence panel in the UI to copy/paste `file:` names into expectations.
  #
  # See EVAL_101.md for detailed guidance on writing and interpreting scenarios.

  # ============================================================================
  # PURPOSE-AWARE RETRIEVAL TESTS
  # ============================================================================
  # These scenarios test that purpose_prompt correctly filters KB content
  
  - id: care_coaching_AL_newcomer
    product: "CARE Coaching"
    state: "AL"
    audiences:
      - "Decision Makers"
    purpose_prompt: "newcomer offering"
    expected:
      # Should retrieve newcomer-specific docs, NOT generic CCNA
      must_have_files:
        - "Empowering Newcomers for Academic Success.pptx"
        - "CARE Coaching Newcomer Learning Walk Tool.pdf"
      avoid_files:
        - "CARE Coaching Needs Assessment (CCNA)"  # Generic, not newcomer-specific

  - id: care_coaching_FL_ccna_focus
    product: "CARE Coaching"
    state: "FL"
    audiences:
